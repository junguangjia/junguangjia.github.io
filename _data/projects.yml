# Projects shown on /research/, newest first by start date.
#
# Each entry supports:
#   title       (required)
#   subtitle    (optional, shown after the title)
#   dates       (optional, shown right-aligned in italics, CV style)
#   meta        (optional, one line of context: course, role, status; Markdown links allowed)
#   description (required, Markdown allowed)
#   url         (optional; the project title links here. Research entries link
#               their PDF report in /files/; leave it out until a report exists)
#   images      (optional list of {src, width, height, alt, caption, full}: figures from
#               the project, floated beside the description so the text wraps
#               around them; each links to `full` (a larger version) or to
#               itself; metadata stripped. Use more than one only when it shows
#               something the first does not)
#   figure_layout (optional; "row" puts the figures side by side under the
#               description; default: one figure floats beside the text)
#   github      (optional; a GitHub logo at the end of the description links here)
#   links       (optional list of {label, url}; only add real, public URLs)
# A language block (fr, ja, zh) may translate title, subtitle, dates, meta,
# description, image_alts and image_captions (in the order of `images`) and
# link_labels (in the order of `links`).
#
# Keep entries factual and never claim publications. Research done in a course
# or grown out of one is called a research project in its field (for example
# "Computational statistics research project"), and `meta` names the course and
# links the course instructor's personal website (their Columbia profile when
# they have none).

academic:
  - title: "Volatility-Estimation Lag and Calibration Memory in Sequential Prediction Intervals"
    url: "/files/ts-calibration-report.pdf"
    dates: "Sep 2026 – Present"
    meta: "Independent time series research project, developed from STAT GR5221 Time Series Analysis (Spring 2026), Columbia University; course instructor: [Franz Rembart](https://franzrembart.com/)"
    description: "Analyzed volatility-estimation lag and calibration memory in rolling prediction intervals, with a causal Python simulation in which every forecast is issued before its observation. On 200 synthetic scale-jump paths, EWMA normalization raised coverage over the first 25 forecasts after an upward shift from 53.7% to 83.4%, still below the 95% target in this exploratory design."
    # The website PDF is an unchanged copy of latex/ts-calibration-report.pdf in the public research repository.
    report_source_commit: "88131468a9a246fa60ef1dc29bbacb8a596a4971"
    report_sha256: "df019cac9d63f68990dffa924d30e3d5b1ceb956150be226ec5307a38c53798e"
    images:
      - src: "/images/research/ts-calibration-upshift-coverage.webp"
        width: 1200
        height: 762
        alt: "Line chart of mean conditional coverage after an upward scale step in 200 synthetic paths: raw rolling calibration starts near 0.55 and recovers slowly toward 0.95, EWMA-normalized intervals start near 0.84 and reach about 0.96 within 50 forecasts, and the oracle-scale reference stays near 0.95."
        caption: "Mean conditional coverage after an upward scale step"
    github: "https://github.com/junguangjia/ts-calibration"
    fr:
      title: "Retard d’estimation de la volatilité et mémoire de calibration dans les intervalles de prédiction séquentiels"
      dates: "sept. 2026 – aujourd’hui"
      meta: "Projet de recherche indépendant en séries temporelles, issu du cours STAT GR5221 Time Series Analysis (printemps 2026), Université Columbia ; enseignant du cours : [Franz Rembart](https://franzrembart.com/)"
      description: "Analyse du retard d’estimation de la volatilité et de la mémoire de calibration dans les intervalles de prédiction glissants, à l’aide d’une simulation causale en Python où chaque prévision est émise avant l’observation correspondante. Sur 200 trajectoires synthétiques à sauts d’échelle, la normalisation EWMA a fait passer de 53,7 % à 83,4 % la couverture des 25 premières prévisions suivant une hausse d’échelle, soit un niveau encore inférieur à la cible de 95 % dans ce cadre exploratoire."
      image_alts:
        - "Graphique en courbes de la couverture conditionnelle moyenne sur 200 trajectoires synthétiques après un saut d’échelle à la hausse : la calibration glissante brute part d’environ 0,55 et remonte lentement vers 0,95, les intervalles normalisés par EWMA partent d’environ 0,84 et atteignent environ 0,96 dans les 50 premières prévisions, et la référence à échelle oracle reste proche de 0,95."
      image_captions:
        - "Couverture conditionnelle moyenne après une hausse d’échelle"
    ja:
      title: "逐次予測区間におけるボラティリティ推定の遅れとキャリブレーションの記憶"
      dates: "2026年9月〜現在"
      meta: "時系列解析の自主研究プロジェクト。コロンビア大学STAT GR5221「時系列解析」（2026年春学期）から発展したもの。同授業の担当教員：[Franz Rembart](https://franzrembart.com/)"
      description: "ローリング予測区間におけるボラティリティ推定の遅れとキャリブレーションの記憶を分析し、各予測を観測値より先に確定させる因果的なPythonシミュレーションを実装した。スケールがジャンプする200本の合成系列では、EWMAで正規化すると、上方へのジャンプ後の最初の25回の予測における被覆率が53.7%から83.4%に上がったが、この探索的な設定では目標の95%には届いていない。"
      image_alts:
        - "200本の合成系列でスケールが上方に変化した後の平均条件付き被覆率を示す折れ線グラフ。素のローリング・キャリブレーションは約0.55から始まってゆっくり0.95に近づき、EWMAで正規化した区間は約0.84から始まって50回以内の予測で約0.96に達し、オラクル・スケールの参照線は約0.95で推移する。"
      image_captions:
        - "スケール上昇後の平均条件付き被覆率"
    zh:
      title: "序贯预测区间中的波动率估计滞后与校准记忆"
      dates: "2026年9月—至今"
      meta: "独立开展的时间序列研究项目，由哥伦比亚大学 STAT GR5221 时间序列分析课程（2026年春季学期）发展而来；课程授课教师：[Franz Rembart](https://franzrembart.com/)"
      description: "分析了滚动预测区间中的波动率估计滞后与校准记忆，并实现了一个因果 Python 模拟，保证每次预测都在相应观测之前给出。在 200 条含尺度跳变的合成路径上，EWMA 标准化使尺度上跳后前 25 次预测的覆盖率从 53.7% 提高到 83.4%，但在这一探索性设计中仍低于 95% 的目标。"
      image_alts:
        - "200 条合成路径中尺度上跳后平均条件覆盖率的折线图：原始滚动校准从约 0.55 开始，缓慢回升至接近 0.95；EWMA 标准化区间从约 0.84 开始，在 50 次预测内达到约 0.96；理想尺度（oracle）参照线保持在约 0.95。"
      image_captions:
        - "尺度上跳后的平均条件覆盖率"

  - title: "Bayesian Modeling of Pulmonary Fibrosis Trajectories"
    url: "/files/bayesian-fvc-trajectories-report.pdf"
    dates: "May 2026 – Sep 2026"
    meta: "Bayesian statistics research project, STAT GR5224 Bayesian Statistics, Columbia University, later extended into a reproducible study; course instructor: [Dobrin Marchev](https://stat.columbia.edu/department-directory/faculty/name/dobrin-marchev/)"
    description: "Fit pooled, hierarchical, and covariate-adjusted Bayesian models in R and Stan to the pulmonary fibrosis trajectories of 176 patients (1,549 forced vital capacity measurements). New-patient prediction was evaluated with five-fold patient-held-out validation, prior sensitivity analyses and posterior predictive checks, which identified residual serial dependence as a limitation. No participant-level data are published."
    # The website PDF is an unchanged copy of results/research/report.pdf in the public research repository.
    report_source_commit: "a3b9a3650c1e04039a05962c431e56075080d430"
    report_sha256: "46205c91bfb70f13785bf5dc6dbaa8925112af46a057bc14e5edd9f75b50d42d"
    figure_layout: row
    images:
      - src: "/images/research/bayesian-fvc-overall-slopes.webp"
        width: 1200
        height: 335
        alt: "Forest plot of posterior means and 95% credible intervals for the overall FVC slope in the pooled (P), hierarchical (H), and covariate-adjusted (C) models: the pooled slope is about −1.5 mL/week with an interval that includes zero, while the hierarchical and adjusted slopes are about −4.25 mL/week, clear of zero."
        caption: "Overall FVC slope: pooled (P), hierarchical (H) and covariate-adjusted (C) models"
      - src: "/images/research/bayesian-fvc-sensitivity.webp"
        width: 1200
        height: 666
        alt: "Forest plot of posterior means and 95% credible intervals for the overall FVC slope in the hierarchical (H) and covariate-adjusted (C) models under the primary analysis, halved and doubled prior scales, and a variant that keeps every original row instead of averaging repeated measurements from the same patient and week: all eight intervals are nearly identical, spanning about −5.1 to −3.4 mL/week with posterior means near −4.2, clear of zero."
        caption: "The slope under prior and data-handling variants"
    github: "https://github.com/junguangjia/bayesian-fvc-trajectories"
    fr:
      title: "Modélisation bayésienne des trajectoires de la fibrose pulmonaire"
      dates: "mai 2026 – sept. 2026"
      meta: "Projet de recherche en statistique bayésienne, STAT GR5224 Bayesian Statistics, Université Columbia, prolongé ensuite en une étude reproductible ; enseignant du cours : [Dobrin Marchev](https://stat.columbia.edu/department-directory/faculty/name/dobrin-marchev/)"
      description: "Estimation, en R et Stan, de modèles bayésiens poolé, hiérarchique et ajusté sur des covariables à partir des trajectoires de fibrose pulmonaire de 176 patients (1 549 mesures de capacité vitale forcée, ou CVF). La prédiction pour de nouveaux patients a été évaluée par une validation croisée à cinq blocs excluant des patients entiers, des analyses de sensibilité aux lois a priori et des vérifications prédictives a posteriori, qui ont mis en évidence une dépendance sérielle résiduelle comme limite du modèle. Aucune donnée individuelle n’est publiée."
      image_alts:
        - "Graphique en forêt des moyennes a posteriori et des intervalles de crédibilité à 95 % de la pente globale de la CVF dans les modèles poolé (P), hiérarchique (H) et ajusté sur des covariables (C) : la pente du modèle poolé est d’environ −1,5 mL par semaine, avec un intervalle qui contient zéro, tandis que celles des modèles hiérarchique et ajusté sont d’environ −4,25 mL par semaine, nettement inférieures à zéro."
        - "Graphique en forêt des moyennes a posteriori et des intervalles de crédibilité à 95 % de la pente globale de la CVF dans les modèles hiérarchique (H) et ajusté sur des covariables (C), pour l’analyse principale, pour des échelles des lois a priori divisées ou multipliées par deux et pour une variante qui conserve toutes les lignes d’origine au lieu de moyenner les mesures répétées d’un même patient au cours d’une même semaine ; les huit intervalles, presque identiques, vont d’environ −5,1 à −3,4 mL par semaine, avec des moyennes a posteriori proches de −4,2, et excluent zéro."
      image_captions:
        - "Pente globale de la CVF : modèles poolé (P), hiérarchique (H) et ajusté sur des covariables (C)"
        - "La pente selon les variantes de lois a priori et de traitement des données"
    ja:
      title: "肺線維症における経時的推移のベイズモデリング"
      dates: "2026年5月〜2026年9月"
      meta: "ベイズ統計学の研究プロジェクト（STAT GR5224「ベイズ統計学」、コロンビア大学）。のちに再現可能な研究へと拡張。担当教員：[Dobrin Marchev](https://stat.columbia.edu/department-directory/faculty/name/dobrin-marchev/)"
      description: "RとStanを用いて、肺線維症患者176人の努力性肺活量（FVC）の経時的推移（測定1,549件）に、プールモデル、階層モデル、共変量調整モデルという3つのベイズモデルを当てはめた。新規患者に対する予測を、患者単位で除外する5分割交差検証、事前分布の感度分析、事後予測チェックで評価し、残差の系列相関がモデルの限界であることを明らかにした。参加者単位のデータは公開していない。"
      image_alts:
        - "プールモデル（P）・階層モデル（H）・共変量調整モデル（C）におけるFVCの全体の傾きの事後平均と95%信用区間を示すフォレストプロット。プールモデルの傾きは約−1.5mL/週で区間がゼロを含む一方、階層モデルと調整モデルの傾きは約−4.25mL/週で、ゼロから明確に離れている。"
        - "階層モデル（H）と共変量調整モデル（C）におけるFVCの全体の傾きの事後平均と95%信用区間を、主解析、事前分布のスケールを半分または2倍にした解析、同一患者・同一週の複数の測定値を平均せずに元の行をすべて残した解析のそれぞれについて示すフォレストプロット。8つの区間はほぼ同じで、事後平均はいずれも約−4.2mL/週、区間はおよそ−5.1〜−3.4mL/週で、ゼロから明確に離れている。"
      image_captions:
        - "FVCの全体の傾き：プール（P）・階層（H）・共変量調整（C）モデル"
        - "事前分布とデータ処理を変えた場合の傾き"
    zh:
      title: "肺纤维化病程轨迹的贝叶斯建模"
      dates: "2026年5月—2026年9月"
      meta: "贝叶斯统计研究项目，哥伦比亚大学 STAT GR5224 贝叶斯统计，课程结束后扩展为可复现的研究；授课教师：[Dobrin Marchev](https://stat.columbia.edu/department-directory/faculty/name/dobrin-marchev/)"
      description: "使用 R 和 Stan，基于 176 名患者的 1,549 次用力肺活量（FVC）测量，对其肺纤维化病程轨迹拟合了合并、分层及协变量调整三种贝叶斯模型。通过按患者整体留出的五折交叉验证、先验敏感性分析和后验预测检验评估对新患者的预测，并发现残差序列相关是模型的局限。项目不公开任何参与者层面的数据。"
      image_alts:
        - "合并模型（P）、分层模型（H）和协变量调整模型（C）中 FVC 总体斜率的后验均值及 95% 可信区间森林图：合并模型的斜率约为每周 −1.5 mL，区间包含零；分层模型与调整模型的斜率约为每周 −4.25 mL，明显偏离零。"
        - "分层模型（H）与协变量调整模型（C）中 FVC 总体斜率的后验均值及 95% 可信区间森林图，涵盖主分析、先验尺度减半、先验尺度加倍，以及不对同一患者同一周的多次测量取平均、保留全部原始行这四种情形。八个区间几乎相同，后验均值均约为每周 −4.2 mL，区间约为每周 −5.1 至 −3.4 mL，均明显偏离零。"
      image_captions:
        - "FVC 总体斜率：合并（P）、分层（H）与协变量调整（C）模型"
        - "不同先验与数据处理方式下的斜率"

  - title: "Stochastic Trace Estimation with Hutchinson and Hutch++"
    url: "/files/stochastic-trace-estimation-report.pdf"
    dates: "Spring 2026 – Present"
    meta: "Computational statistics research project, STAT GR6104 Computational Statistics, Columbia University; course instructor: [Christopher R. Harshaw](https://www.chrisharshaw.com/)"
    description: "Reconstructed the unbiasedness and complexity arguments for Hutchinson and Hutch++ and implemented reproducible Julia comparisons on a fixed PSD matrix and a synthetic graph, comparing error and matrix–vector query cost over 1,000 trials per budget, with runtime timed separately. On the fixed PSD instance, Hutch++ reached below 1% mean absolute relative error at 30 queries."
    # The website PDF is an unchanged snapshot of the public research repository.
    report_source_commit: "35a26f96a3a4d27ba5fe60b1c419184ec8c728aa"
    report_sha256: "68072a180eb5d1e67b0def25e13ba51055654902d2846a84a60dc85efc3ce6bc"
    figure_layout: row
    images:
      - src: "/images/research/trace-psd-error.webp"
        width: 1200
        height: 720
        alt: "Plot of mean absolute relative error against the operator-query budget on the exponential-spectrum PSD matrix: the Hutch++ error falls by several orders of magnitude while the Hutchinson error decreases only slowly."
        caption: "Error on a fixed exponential-spectrum PSD matrix"
      - src: "/images/research/trace-sbm-error.webp"
        width: 1200
        height: 720
        alt: "Plot of mean absolute relative error of triangle-count estimates against the operator-query budget on one synthetic stochastic block model graph: both methods improve as the budget grows, and Hutch++ stays below Hutchinson at every budget."
        caption: "Triangle-count error on a synthetic SBM graph"
    github: "https://github.com/junguangjia/stochastic-trace-estimation"
    fr:
      title: "Estimation stochastique de la trace avec les méthodes de Hutchinson et Hutch++"
      dates: "printemps 2026 – aujourd’hui"
      meta: "Projet de recherche en statistique computationnelle, STAT GR6104 Computational Statistics, Université Columbia ; enseignant du cours : [Christopher R. Harshaw](https://www.chrisharshaw.com/)"
      description: "Reconstitution des arguments d’absence de biais et de complexité des méthodes de Hutchinson et Hutch++, et mise en œuvre en Julia de comparaisons reproductibles sur une matrice fixe semi-définie positive (PSD) et un graphe synthétique, portant sur l’erreur et le coût en produits matrice-vecteur, avec 1 000 essais par budget, le temps de calcul étant mesuré séparément. Sur l’instance PSD fixe, Hutch++ passe sous 1 % d’erreur relative absolue moyenne dès 30 requêtes."
      image_alts:
        - "Graphique de l’erreur relative absolue moyenne en fonction du budget de requêtes à l’opérateur sur la matrice PSD à spectre exponentiel : l’erreur de Hutch++ diminue de plusieurs ordres de grandeur, tandis que celle de Hutchinson ne diminue que lentement."
        - "Graphique de l’erreur relative absolue moyenne des estimations du nombre de triangles en fonction du budget de requêtes à l’opérateur sur un graphe synthétique à blocs stochastiques : les deux méthodes s’améliorent quand le budget augmente, et Hutch++ reste sous Hutchinson pour chaque budget."
      image_captions:
        - "Erreur sur une matrice PSD fixe à spectre exponentiel"
        - "Erreur de comptage des triangles sur un graphe SBM synthétique"
    ja:
      title: "HutchinsonおよびHutch++による確率的トレース推定"
      dates: "2026年春学期〜現在"
      meta: "計算統計学の研究プロジェクト（STAT GR6104「計算統計学」、コロンビア大学）。担当教員：[Christopher R. Harshaw](https://www.chrisharshaw.com/)"
      description: "HutchinsonとHutch++の不偏性と計算量に関する議論を再構成し、固定の半正定値（PSD）行列と合成グラフを対象に、Juliaで再現可能な比較を実装した。クエリ予算ごとに1,000回の試行を行って誤差と行列ベクトル積のクエリ数を比較し、実行時間は別途計測した。固定のPSD行列では、Hutch++は30回のクエリで平均絶対相対誤差1%未満を達成した。"
      image_alts:
        - "指数型スペクトルのPSD行列における、作用素クエリ予算に対する平均絶対相対誤差のグラフ。Hutch++の誤差は数桁にわたって減少する一方、Hutchinsonの誤差はゆっくりとしか減少しない。"
        - "確率的ブロックモデルで生成した合成グラフ1つについて、三角形数推定の平均絶対相対誤差を作用素クエリ予算に対して示した図。予算が増えるとどちらの手法も改善し、どの予算でもHutch++の誤差がHutchinsonの誤差を下回る。"
      image_captions:
        - "指数型スペクトルの固定PSD行列での誤差"
        - "合成SBMグラフでの三角形数推定の誤差"
    zh:
      title: "基于 Hutchinson 与 Hutch++ 的随机迹估计"
      dates: "2026年春季学期—至今"
      meta: "计算统计研究项目，哥伦比亚大学 STAT GR6104 计算统计学；授课教师：[Christopher R. Harshaw](https://www.chrisharshaw.com/)"
      description: "重新推导了 Hutchinson 与 Hutch++ 的无偏性和复杂度论证，并用 Julia 在一个固定的半正定（PSD）矩阵和一个合成图上完成了可复现的对比实验，每个预算重复 1,000 次试验，比较误差和矩阵-向量查询成本，运行时间则单独计时。在固定 PSD 实例上，Hutch++ 在 30 次查询时平均绝对相对误差低于 1%。"
      image_alts:
        - "指数型谱 PSD 矩阵上平均绝对相对误差随算子查询预算变化的图：Hutch++ 的误差下降了几个数量级，而 Hutchinson 的误差仅缓慢下降。"
        - "在一个合成随机块模型图上，三角形计数估计的平均绝对相对误差随算子查询预算变化的图：两种方法的误差都随预算增加而下降，且在每个预算下 Hutch++ 的误差都低于 Hutchinson。"
      image_captions:
        - "具有指数型谱的固定 PSD 矩阵上的误差"
        - "合成 SBM 图上三角形计数的误差"

  - title: "Finite-Horizon Inference for Weak Ornstein–Uhlenbeck Mean Reversion"
    url: "/files/ou-inference-report.pdf"
    dates: "Spring 2026 – Present"
    meta: "Stochastic processes research project, developed from STAT GU4264/GR5264 Stochastic Processes–Applications I (Spring 2026), Columbia University; course instructor: [Steven Campbell](https://www.stevenacampbell.com/)"
    description: "Derived and implemented the exact Ornstein–Uhlenbeck likelihood and analytic nuisance profiling in Julia for irregular observation times, including the Brownian-with-drift boundary. Studied finite-horizon inference through information bounds and 1,600 simulated trajectories, finding conservative split-profile inference with limited power, checked against independent Python and R calculations. The study claims no new method."
    # The website PDF is an unchanged copy of latex/ou-inference-report.pdf in the public research repository.
    report_source_commit: "b440c1c50af9027566b0091b04f5c2cd51e0b479"
    report_sha256: "2643bdeb229ddee770b4b5f991769758f4c004f62a81b4b3e1ea373681121b95"
    images:
      - src: "/images/research/ou-membership-regular64.webp"
        full: "/images/research/ou-membership-grid.webp"
        width: 1200
        height: 869
        alt: "Plot of true-parameter membership with 95% Wilson intervals (100 trajectories per point) for regular sampling with n = 64 transitions: the split-profile rule stays at 0.99–1.00 for every true κT (0, 0.1, 1, 4), while the uncalibrated likelihood-ratio diagnostic is about 0.72–0.73 up to κT = 1 and 0.89 at κT = 4, below the dashed 0.95 line."
        caption: "Truth membership, regular sampling"
    github: "https://github.com/junguangjia/ou-inference"
    fr:
      title: "Inférence à horizon fini sur un faible retour à la moyenne dans les processus d’Ornstein–Uhlenbeck"
      dates: "printemps 2026 – aujourd’hui"
      meta: "Projet de recherche en processus stochastiques, issu du cours STAT GU4264/GR5264 Stochastic Processes–Applications I (printemps 2026), Université Columbia ; enseignant du cours : [Steven Campbell](https://www.stevenacampbell.com/)"
      description: "Établissement et mise en œuvre en Julia de la vraisemblance exacte du processus d’Ornstein–Uhlenbeck et d’un profilage analytique des paramètres de nuisance pour des instants d’observation irréguliers, y compris le cas limite du mouvement brownien avec dérive. Étude de l’inférence à horizon fini au moyen de bornes d’information et de 1 600 trajectoires simulées : l’inférence par vraisemblance profilée à découpage s’est révélée conservatrice et de puissance limitée, avec des vérifications numériques indépendantes en Python et en R. L’étude ne prétend proposer aucune nouvelle méthode."
      image_alts:
        - "Graphique du taux d’appartenance du vrai paramètre à l’ensemble de confiance, avec intervalles de Wilson à 95 % (100 trajectoires par point), pour un échantillonnage régulier de n = 64 transitions : la règle de vraisemblance profilée à découpage reste entre 0,99 et 1,00 pour chaque vraie valeur de κT (0 ; 0,1 ; 1 ; 4), tandis que le diagnostic de rapport de vraisemblance non calibré vaut environ 0,72 à 0,73 jusqu’à κT = 1 et 0,89 à κT = 4, sous la ligne pointillée à 0,95."
      image_captions:
        - "Appartenance du vrai paramètre à l’ensemble de confiance, échantillonnage régulier"
    ja:
      title: "オルンシュタイン＝ウーレンベック過程における弱い平均回帰の有限期間推測"
      dates: "2026年春学期〜現在"
      meta: "確率過程の研究プロジェクト。コロンビア大学STAT GU4264/GR5264「確率過程とその応用 I」（2026年春学期）から発展したもの。同授業の担当教員：[Steven Campbell](https://www.stevenacampbell.com/)"
      description: "不規則な観測時点に対応したオルンシュタイン＝ウーレンベック過程の厳密な尤度と局外パラメータの解析的なプロファイリングを、ドリフト付きブラウン運動という境界の場合も含めて導出し、Juliaで実装した。情報量の上界と1,600本のシミュレーション系列を用いて有限期間の推測を調べ、分割プロファイル法による推測が保守的で検出力が低いことを確認し、PythonとRによる独立した数値検証も行った。本研究は新しい手法を提案したと主張するものではない。"
      image_alts:
        - "等間隔観測（n = 64回の推移）における真のパラメータの包含率を95% Wilson区間（各点100本の系列）とともに示すグラフ。分割プロファイル法はどの真のκT（0、0.1、1、4）でも0.99〜1.00である一方、較正していない尤度比診断はκT = 1までは約0.72〜0.73、κT = 4では0.89で、0.95の破線を下回る。"
      image_captions:
        - "真の値の包含率（等間隔観測）"
    zh:
      title: "Ornstein–Uhlenbeck 过程弱均值回归的有限时域推断"
      dates: "2026年春季学期—至今"
      meta: "随机过程研究项目，由哥伦比亚大学 STAT GU4264/GR5264 随机过程及其应用 I 课程（2026年春季学期）发展而来；课程授课教师：[Steven Campbell](https://www.stevenacampbell.com/)"
      description: "推导并用 Julia 实现了 Ornstein–Uhlenbeck 过程的精确似然与冗余参数的解析剖面化，支持不规则观测时间，并涵盖带漂移布朗运动这一边界情形。借助信息界与 1,600 条模拟轨迹研究有限时域推断，发现分割剖面推断偏保守且功效有限，并以独立的 Python 和 R 数值计算进行核对。该研究并不声称提出了新方法。"
      image_alts:
        - "等间隔采样（n = 64 次转移）下真实参数包含率及 95% Wilson 区间（每点 100 条轨迹）的图：对每个真实 κT（0、0.1、1、4），分割剖面规则都在 0.99～1.00 之间，而未经校准的似然比诊断在 κT 不超过 1 时约为 0.72～0.73，在 κT = 4 时为 0.89，均低于 0.95 处的虚线。"
      image_captions:
        - "真实参数包含率（等间隔采样）"

