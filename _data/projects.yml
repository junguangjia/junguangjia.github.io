# Projects shown on /research/.
#
# Each entry supports:
#   title       (required)
#   subtitle    (optional, shown after the title)
#   dates       (optional, shown right-aligned in italics, CV style)
#   meta        (optional, one line of context: course, role, status)
#   description (required, Markdown allowed)
#   url         (optional; the project title links here)
#   links       (optional list of {label, url}; only add real, public URLs)
#
# Keep entries factual. Course projects are labeled as such and are not publications.

academic:
  - title: "Stochastic Trace Estimation"
    dates: "Spring 2026"
    meta: "Course project, STAT GR6104 Computational Statistics, Columbia University"
    description: >-
      Studied the Hutchinson and Hutch++ trace estimators, including their unbiasedness,
      variance reduction, and computational complexity. Implemented reproducible
      experiments in Julia, including an application to triangle counting in sparse graphs.
    links: []

independent:
  - title: "ArtVenn"
    subtitle: "Cultural Heritage Catalog and Community Platform"
    url: "https://github.com/junguangjia/moya-inscriptions-web"
    dates: "2026 – Present"
    meta: "Founder and technical project lead; ongoing independent open-source project (development / pilot)"
    description: >-
      An independently developed platform for organizing and presenting Chinese
      inscriptions and calligraphy materials. Work includes structured catalog data,
      search, data-import workflows, and editorial publishing, using TypeScript,
      Next.js/React, Node.js, and PostgreSQL.
    links:
      - label: "Source code on GitHub (Apache-2.0)"
        url: "https://github.com/junguangjia/moya-inscriptions-web"
