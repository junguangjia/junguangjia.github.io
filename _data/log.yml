# Log entries (the /log/ page), newest first. Entries are grouped under a year
# heading taken from the last four characters of `date`, so write dates like
# "May 2026", "Spring 2026", or "2025".
#
#   date: shown as written
#   type: one of research, project, reading, teaching, work, milestone, life
#         (shown as a small label; any other word also works)
#   text: one or two sentences; Markdown links are allowed. For a paper,
#         for example: 'Read [*Title*](https://arxiv.org/abs/...) by A. Author
#         and B. Author (2024): one line on what stood out.'

