    text: "コロンビア大学のSTAT GR5221「時系列解析」から発展した、[逐次予測区間におけるボラティリティ推定の遅れとキャリブレーションの記憶に関する時系列解析の自主研究プロジェクト](/research/)を開始した。現在も進行中である。"
  zh:
