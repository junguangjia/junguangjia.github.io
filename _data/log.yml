# Log entries (the /log/ page), newest first. Entries are grouped under a year
# heading taken from the last four characters of `date`, so write dates like
# "May 2026", "Spring 2026", or "2025".
#
#   date: shown as written
#   type: one of research, project, reading, teaching, milestone, life
#         (shown as a small label; any other word also works)
#   text: one or two sentences; Markdown links are allowed. For a paper,
#         for example: 'Read [*Title*](https://arxiv.org/abs/...) by A. Author
#         and B. Author (2024): one line on what stood out.'

- date: "Sep 2026"
  type: research
  text: "Started an independent [research-feasibility study on volatility-estimation lag and calibration memory in sequential prediction intervals](/research/), developed from homework in STAT GR5221 Time Series Analysis at Columbia; the work is ongoing."
  fr:
    date: "sept. 2026"
    text: "Début d’une [étude de faisabilité indépendante sur le retard d’estimation de la volatilité et la mémoire de calibration dans les intervalles de prédiction séquentiels](/research/), issue de devoirs du cours STAT GR5221 Time Series Analysis à Columbia ; travail en cours."
  ja:
    date: "2026年9月"
    text: "コロンビア大学のSTAT GR5221「時系列解析」の課題をもとに、[逐次予測区間におけるボラティリティ推定の遅れとキャリブレーションの記憶に関する自主研究](/research/)を開始した。現在も進行中である。"
  zh:
    date: "2026年9月"
    text: "在哥伦比亚大学 STAT GR5221 时间序列分析课程作业的基础上，启动了[序贯预测区间中波动率估计滞后与校准记忆的独立研究](/research/)，目前仍处于可行性探索阶段。"

