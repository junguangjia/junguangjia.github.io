    text: "Début d’un [projet de recherche indépendant en séries temporelles sur le retard d’estimation de la volatilité et la mémoire de calibration dans les intervalles de prédiction séquentiels](/research/), issu du cours STAT GR5221 Time Series Analysis à Columbia ; travail en cours."
  ja:
