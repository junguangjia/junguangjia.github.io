<!-- Site-specific behaviour.
     NOTE: the production build compresses HTML onto single lines, so this
     script must only use block comments, never // line comments.
     The theme follows the operating system; see _includes/head/custom.html.
     Expose the open/closed state of the navigation and "Follow" disclosure
        buttons, keep it in sync after the template's resize handling, and make the
        collapsed navigation menu keyboard friendly and dismissible. -->
<script>
  (function () {
    var nav = document.getElementById('site-nav');
    var navBtn = document.querySelector('#site-nav > button');
    var hidden = document.querySelector('#site-nav .hidden-links');
    var followBtn = document.querySelector('.author__urls-wrapper button');
    var urls = document.querySelector('.author__urls');
    function syncNav() {
      if (navBtn && hidden) { navBtn.setAttribute('aria-expanded', hidden.classList.contains('hidden') ? 'false' : 'true'); }
    }
    function syncFollow() {
      if (followBtn && urls) { followBtn.setAttribute('aria-expanded', getComputedStyle(urls).display === 'none' ? 'false' : 'true'); }
    }
    function navOpen() { return hidden && !hidden.classList.contains('hidden'); }
    function closeNav() { if (navOpen() && navBtn) { navBtn.click(); } }
    if (nav && navBtn && hidden) {
      new MutationObserver(syncNav).observe(hidden, { attributes: true, attributeFilter: ['class'] });
      /* Keyboard activation (click detail 0): move focus into the opened menu. */
      navBtn.addEventListener('click', function (e) {
        if (e.detail === 0) {
          setTimeout(function () { var first = navOpen() ? hidden.querySelector('a') : null; if (first) { first.focus(); } }, 0);
        }
      });
      /* Dismiss the open menu with Escape, when focus leaves it, or on an outside tap. */
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && navOpen()) { closeNav(); navBtn.focus(); }
      });
      nav.addEventListener('focusout', function () {
        /* Deferred so that window blur (relatedTarget null) does not close it. */
        setTimeout(function () {
          if (navOpen() && document.hasFocus() && !nav.contains(document.activeElement)) { closeNav(); }
        }, 0);
      });
      document.addEventListener('pointerdown', function (e) {
        if (navOpen() && !nav.contains(e.target)) { closeNav(); }
      });
    }
    if (followBtn) { followBtn.addEventListener('click', function () { setTimeout(syncFollow, 250); }); }
    var lastWidth = window.innerWidth;
    window.addEventListener('resize', function () {
      /* The template's resize handler forces the "Follow" list open at wide
         widths and leaves that inline style behind; reset it only when the
         viewport crosses the 925px breakpoint downwards. */
      var crossedDown = lastWidth >= 925 && window.innerWidth < 925;
      lastWidth = window.innerWidth;
      setTimeout(function () {
        if (urls && crossedDown) { urls.style.display = ''; }
        syncNav(); syncFollow();
      }, 50);
    });
    window.addEventListener('load', function () { syncNav(); syncFollow(); });
  })();
</script>
