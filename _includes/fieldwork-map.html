{% comment %}Shared English atlas: real geographic data and explicitly approximate personal routes.{% endcomment %}
<figure class="fieldwork-atlas-embed" lang="en">
  <iframe class="fieldwork-atlas-frame" src="{{ '/maps/fieldwork/' | relative_url }}"
    title="ArtVenn field atlas: China, Mongolia, South Korea and Japan"
    loading="lazy" allow="fullscreen" allowfullscreen
    style="display:block;width:100%;height:980px;border:1px solid var(--global-border-color);background:transparent;"></iframe>
  <figcaption>
    <a href="{{ '/maps/fieldwork/' | relative_url }}" target="_blank" rel="noopener">Open the interactive atlas ↗</a>
    <span> · English map. Approximate routes and selected locations; not GPS tracks.</span>
  </figcaption>
</figure>
<script src="{{ '/assets/js/fieldwork-map-embed.js' | relative_url }}" defer></script>
