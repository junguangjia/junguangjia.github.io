{% comment %}Fieldwork route map (maps/fieldwork/): Natural Earth basemap with schematic routes, one colour per trip. English on every language page. The frame keeps a 4:3 shape within fixed limits, so it needs no resize script.{% endcomment %}
<figure class="misc-figure fieldwork-map" lang="en">
  <iframe class="fieldwork-map__frame" src="{{ '/maps/fieldwork/' | relative_url }}"
    title="Map of fieldwork trips across China, South Korea, Japan and Mongolia"
    loading="lazy"
    style="display:block;width:100%;height:auto;aspect-ratio:4/3;min-height:420px;max-height:620px;margin:0;border:1px solid var(--global-border-color);border-radius:6px;background:#EAF1F5;"></iframe>
  <figcaption>Routes are schematic reconstructions rather than GPS tracks.</figcaption>
</figure>
